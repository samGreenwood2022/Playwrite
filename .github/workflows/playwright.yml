name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Cucumber feature tests
      run: npm run regression
      env:
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    # Tag one scenario with @trace-this to get its trace.zip from this run,
    # pass or fail, without tracing the whole suite. No-op (0 scenarios) if
    # nothing is tagged, so this step is safe to leave in permanently.
    - name: Run single traced scenario (tag it @trace-this)
      run: npm run trace-scenario
      env:
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: trace-scenario
        path: reports/traces/trace-scenario/
        retention-days: 7
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: cucumber-report
        path: reports/
        retention-days: 7
    # Uploads visual regression snapshots so the Linux baseline generated
    # on a first CI run can be downloaded and committed to the repo.
    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: visual-regression-snapshots
        path: tests/snapshots/
        retention-days: 7
